# Release workflow
name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write
  packages: write

jobs:
  release:
    name: Create Release
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      with:
        fetch-depth: 0
    
    - name: Set up Go
      uses: actions/setup-go@v5
      with:
        go-version: '1.25'
    
    - name: Run tests
      run: go test -v ./...
    
    - name: Build binaries
      run: |
        GOOS=linux GOARCH=amd64 CGO_ENABLED=0 go build -o bin/api-gateway-linux-amd64 ./cmd/api-gateway
        GOOS=linux GOARCH=arm64 CGO_ENABLED=0 go build -o bin/api-gateway-linux-arm64 ./cmd/api-gateway
        GOOS=darwin GOARCH=amd64 CGO_ENABLED=0 go build -o bin/api-gateway-darwin-amd64 ./cmd/api-gateway
        GOOS=darwin GOARCH=arm64 CGO_ENABLED=0 go build -o bin/api-gateway-darwin-arm64 ./cmd/api-gateway
    
    - name: Create release notes
      id: release_notes
      uses: actions/github-script@v7
      with:
        github-token: ${{ secrets.GITHUB_TOKEN }}
        script: |
          const commits = await github.rest.repos.listCommits({
            owner: context.repo.owner,
            repo: context.repo.repo,
            per_page: 100
          });
          
          let changes = '## Changes\n\n';
          for (const commit of commits.data) {
            changes += `- ${commit.commit.message}\n`;
          }
          
          return changes;
    
    - name: Create GitHub Release
      uses: softprops/action-gh-release@v1
      with:
        files: bin/*
        body: ${{ steps.release_notes.outputs.result }}
        draft: false
        prerelease: false
        generate_release_notes: true
    
    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v3
    
    - name: Log in to Container Registry
      uses: docker/login-action@v3
      with:
        registry: ghcr.io
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}
    
    - name: Build and push Docker images
      run: |
        for service in api-gateway session-memory qwen-wrapper llm-proxy tools-executor; do
          docker build -f deployments/docker/Dockerfile.$service \
            -t ghcr.io/${{ github.repository }}/$service:${{ github.ref_name }} \
            -t ghcr.io/${{ github.repository }}/$service:latest \
            .
          docker push ghcr.io/${{ github.repository }}/$service:${{ github.ref_name }}
          docker push ghcr.io/${{ github.repository }}/$service:latest
        done
