<!DOCTYPE html>
<html>
<head>
    <title>Debug Test</title>
    <style>
        body { font-family: Arial; background: #0f172a; color: white; padding: 20px; }
        #output { background: #1e293b; padding: 20px; border-radius: 8px; margin: 20px 0; min-height: 100px; }
        input { width: 70%; padding: 10px; border-radius: 8px; border: 1px solid #334155; background: #1e293b; color: white; }
        button { padding: 10px 20px; border-radius: 8px; border: none; background: #3b82f6; color: white; cursor: pointer; }
    </style>
</head>
<body>
    <h1>🧪 Debug Test</h1>
    <div id="output">Нажмите "Тест" чтобы проверить...</div>
    <input type="text" id="test-input" placeholder="Введите текст">
    <button onclick="testClick()">Тест</button>
    <button onclick="sendMessage()">Отправить (sendMessage)</button>
    
    <script>
        console.log('=== DEBUG SCRIPT STARTED ===');
        
        function testClick() {
            console.log('testClick вызван!');
            const val = document.getElementById('test-input').value;
            document.getElementById('output').innerHTML = '✅ testClick работает! Введено: ' + val;
        }
        
        // Проверяем что sendMessage существует
        console.log('sendMessage существует:', typeof window.sendMessage !== 'undefined');
        console.log('newChat существует:', typeof window.newChat !== 'undefined');
        
        // Загружаем app.js динамически
        const script = document.createElement('script');
        script.src = 'app.js';
        script.onload = function() {
            console.log('✅ app.js загружен!');
            console.log('sendMessage после загрузки:', typeof window.sendMessage);
        };
        document.head.appendChild(script);
        
        console.log('=== DEBUG SCRIPT END ===');
    </script>
</body>
</html>
