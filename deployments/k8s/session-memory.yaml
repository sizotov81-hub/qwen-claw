# Deployment для Session Memory Service
apiVersion: apps/v1
kind: Deployment
metadata:
  name: session-memory
  namespace: qwen-claw
  labels:
    app: session-memory
    app.kubernetes.io/name: session-memory
    app.kubernetes.io/part-of: qwen-claw
spec:
  replicas: 2
  selector:
    matchLabels:
      app: session-memory
  template:
    metadata:
      labels:
        app: session-memory
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "59091"
    spec:
      serviceAccountName: qwen-claw
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
      containers:
      - name: session-memory
        image: ghcr.io/sizotov81-hub/qwen-claw/session-memory:latest
        imagePullPolicy: Always
        ports:
        - name: grpc
          containerPort: 55051
          protocol: TCP
        - name: metrics
          containerPort: 59091
          protocol: TCP
        env:
        - name: SERVICE_NAME
          value: "session-memory"
        envFrom:
        - configMapRef:
            name: qwen-claw-config
        - secretRef:
            name: qwen-claw-secrets
        resources:
          requests:
            cpu: 100m
            memory: 256Mi
          limits:
            cpu: 500m
            memory: 512Mi
        livenessProbe:
          exec:
            command: ["/app/session-memory", "health"]
          initialDelaySeconds: 10
          periodSeconds: 30
        readinessProbe:
          exec:
            command: ["/app/session-memory", "ready"]
          initialDelaySeconds: 5
          periodSeconds: 10
---
# Service для Session Memory
apiVersion: v1
kind: Service
metadata:
  name: session-memory
  namespace: qwen-claw
  labels:
    app: session-memory
spec:
  type: ClusterIP
  ports:
  - name: grpc
    port: 55051
    targetPort: grpc
    protocol: TCP
  selector:
    app: session-memory
