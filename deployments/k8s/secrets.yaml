# Secrets для Qwen-Claw
# Примечание: В продакшене используйте external secrets manager
apiVersion: v1
kind: Secret
metadata:
  name: qwen-claw-secrets
  namespace: qwen-claw
  labels:
    app: qwen-claw
type: Opaque
stringData:
  DB_PASSWORD: "qwenclaw_password_change_me"
  RABBITMQ_USER: "qwenclaw"
  RABBITMQ_PASSWORD: "qwenclaw_password_change_me"
  JWT_SECRET: "change-me-in-production-use-long-random-string"
  
  # LLM API keys
  OPENAI_API_KEY: ""
  ANTHROPIC_API_KEY: ""
  DASHSCOPE_API_KEY: ""
  
  # Telegram bot token
  TELEGRAM_TOKEN: ""
