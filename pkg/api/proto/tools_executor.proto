// Protocol Buffers для Qwen-Claw Tools Executor Service
// Версия: 1.0.0

syntax = "proto3";

package qwenclaw.tools.v1;

option go_package = "github.com/user/qwen-claw/pkg/api/proto";

// ============================================
// Tools Executor Service
// ============================================

service ToolsExecutor {
    // Выполнить инструмент
    rpc Execute(ExecuteRequest) returns (ExecuteResponse);
    
    // Получить список доступных инструментов
    rpc ListTools(Empty) returns (ToolList);
    
    // Получить информацию об инструменте
    rpc GetToolInfo(ToolInfoRequest) returns (ToolInfo);
    
    // Получить статус сервиса
    rpc GetStatus(Empty) returns (ServiceStatus);
}

// ============================================
// Запросы и ответы
// ============================================

// Запрос на выполнение
message ExecuteRequest {
    string tool_name = 1;
    map<string, string> args = 2;
    string session_id = 3;
    int64 timeout = 4;
    map<string, string> options = 5;
}

// Ответ на выполнение
message ExecuteResponse {
    bool success = 1;
    string output = 2;
    string error = 3;
    int64 duration_ms = 4;
    int32 exit_code = 5;
    map<string, string> metadata = 6;
}

// Список инструментов
message ToolList {
    repeated ToolInfo tools = 1;
}

// Информация об инструменте
message ToolInfo {
    string name = 1;
    string description = 2;
    string version = 3;
    repeated string commands = 4;
    map<string, string> parameters = 5;
    bool requires_confirmation = 6;
    bool is_enabled = 7;
}

// Запрос на информацию об инструменте
message ToolInfoRequest {
    string tool_name = 1;
}

// Статус сервиса
message ServiceStatus {
    bool healthy = 1;
    string version = 2;
    int32 tools_count = 3;
    int32 active_executions = 4;
    string sandbox_type = 5; // none/docker/firecracker
}

// Пустое сообщение
message Empty {}
